# Production Logging Configuration
# Production ortamında sadece INFO, WARN ve ERROR seviyeleri görünür
# DEBUG ve TRACE seviyeleri kapalı (performans ve güvenlik için)

# Application Logging
logging.level.com.beratcan.app=INFO

# Spring Framework Logging
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.transaction=WARN
logging.level.org.springframework.data=WARN

# Hibernate/JPA SQL Logging - Production'da kapalı
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
spring.jpa.show-sql=false

# Log Pattern - Production için temiz format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %5p [%t] %-40.40logger{39} : %m%n

# Database Configuration - Production
# Hibernate ddl-auto=validate (update yerine - güvenlik için)
spring.jpa.hibernate.ddl-auto=validate

# Connection pool ayarları (production için)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Actuator Health Check Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true


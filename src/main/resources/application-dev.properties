# Development Database Configuration (Localhost)
# Env variable'lardan bağımsız olarak local DB'yi zorla
spring.datasource.url=jdbc:postgresql://localhost:5432/soruapp?sslmode=disable
spring.datasource.username=berat
spring.datasource.password=123

# Dev ortamı loglaması
logging.level.com.beratcan.app=DEBUG
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate ddl-auto=validate (Schema'yı Flyway yönetiyor - update Flyway ile çakışıyor)
spring.jpa.hibernate.ddl-auto=validate

# Flyway: Mevcut DB'yi baseline olarak kabul et
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=4

# Dev ortamında Swagger UI açık
springdoc.swagger-ui.enabled=true

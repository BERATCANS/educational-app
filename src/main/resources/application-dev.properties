# Development Database Configuration (Localhost)
# Env variable'lardan bağımsız olarak local DB'yi zorla
spring.datasource.url=jdbc:postgresql://localhost:5432/soruapp
spring.datasource.username=berat
spring.datasource.password=123

# Dev ortamı loglaması
logging.level.com.beratcan.app=DEBUG
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate ddl-auto=update (Dev ortamında şema otomatik güncellensin)
spring.jpa.hibernate.ddl-auto=update

# Dev ortamında Swagger UI açık
springdoc.swagger-ui.enabled=true

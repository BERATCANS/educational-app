# Database Configuration - Environment variables kullanılıyor
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/soruapp}
spring.datasource.username=${DB_USERNAME:berat}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Open Session in View - REST API'lerde kapatılması önerilir (performans için)
spring.jpa.open-in-view=false

# Log seviyesini artır
logging.level.com.beratcan.app=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
# Hibernate SQL log'ları için
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# OpenAI GPT-4o-mini Configuration - Environment variables kullanılıyor
openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o}
openai.timeout=${OPENAI_TIMEOUT:120}

# AI Prompt Engineering Configuration
ai.hint.prompt.temperature=0.3
ai.chat.prompt.temperature=0.5
ai.chat.max.attempts.before.reveal=5
ai.chat.response.max.words=200
ai.chat.response.medium.words=400

# CORS Configuration - Environment variables kullanılıyor
# Allowed origins - Production'da sadece production URL'leri ekle
allowed.origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173}

# JWT Configuration - Environment variables kullanılıyor
# Secret key - Production'da mutlaka güçlü bir secret key kullanın (min 32 karakter)
jwt.secret=${JWT_SECRET:}
# Token expiration time - 1 saat (milisaniye cinsinden)
jwt.expiration=3600000
# Refresh token expiration - 7 gün (milisaniye cinsinden)
jwt.refresh-expiration=604800000

# Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# Application Profile
# dev: Detaylı error mesajları gösterilir, .env dosyası kullanılır
# prod: Generic error mesajları gösterilir (güvenlik için), sadece environment variables kullanılır
# Production'da SPRING_PROFILES_ACTIVE=prod environment variable'ı set edilmeli
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# File Upload Configuration
file.upload.dir=uploads/

# Application Base URL (örneğin backend kendi linkleri için kullanabilir) - Environment variables kullanılıyor
# IP adresi otomatik olarak algılanır veya manuel olarak ayarlanabilir
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Frontend URL (email doğrulama linki bu domain'e gidecek)
# Örn: https://kitappai.com
app.frontend-url=${APP_FRONTEND_URL:https://kitappai.com}

# Email Configuration - Hostinger - Environment variables kullanılıyor
spring.mail.host=${EMAIL_HOST:smtp.hostinger.com}
spring.mail.port=${EMAIL_PORT:465}
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.hostinger.com
spring.mail.properties.mail.smtp.ssl.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email From Address - Environment variables kullanılıyor
app.email.from=${APP_EMAIL_FROM:}

# Feedback Email Configuration
app.feedback.email=${APP_FEEDBACK_EMAIL:info@kitappai.com}

# OpenAI TTS Configuration
openai.tts.model=${OPENAI_TTS_MODEL:tts-1}
openai.tts.voice=${OPENAI_TTS_VOICE:alloy}
openai.tts.response.format=mp3
openai.tts.speed=1.0

# Audio Temporary Storage
audio.temp.dir=uploads/audio/temp/
audio.temp.max.age.hours=24
audio.max.size.mb=10
audio.allowed.formats=mp3,wav,webm,m4a

# DigitalOcean Spaces Configuration (Production)
# These are used when SPRING_PROFILES_ACTIVE=prod
do.spaces.endpoint=${DO_SPACES_ENDPOINT:}
do.spaces.key=${DO_SPACES_KEY:}
do.spaces.secret=${DO_SPACES_SECRET:}
do.spaces.bucket=${DO_SPACES_BUCKET:}
do.spaces.region=${DO_SPACES_REGION:}
do.spaces.cdn.endpoint=${DO_SPACES_CDN_ENDPOINT:}


version: "3.9"

# Production docker-compose (DigitalOcean Database kullanır)
# Kullanım: docker-compose -f docker-compose.prod.yml up -d

services:
  # Backend Spring Boot Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Database Configuration (DigitalOcean Managed Database)
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}

      # Spring Profile
      - SPRING_PROFILES_ACTIVE=prod

      # JWT Configuration
      - JWT_SECRET=${JWT_SECRET}

      # OpenAI Configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT:-120}

      # Email Configuration
      - EMAIL_HOST=${EMAIL_HOST:-smtp.hostinger.com}
      - EMAIL_PORT=${EMAIL_PORT:-465}
      - EMAIL_USERNAME=${EMAIL_USERNAME}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - APP_EMAIL_FROM=${APP_EMAIL_FROM}

      # DigitalOcean Spaces Configuration
      - DO_SPACES_ENDPOINT=${DO_SPACES_ENDPOINT}
      - DO_SPACES_KEY=${DO_SPACES_KEY}
      - DO_SPACES_SECRET=${DO_SPACES_SECRET}
      - DO_SPACES_BUCKET=${DO_SPACES_BUCKET}
      - DO_SPACES_REGION=${DO_SPACES_REGION}
      - DO_SPACES_CDN_ENDPOINT=${DO_SPACES_CDN_ENDPOINT}

      # Application Configuration
      - APP_BASE_URL=${APP_BASE_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    # Healthcheck (DigitalOcean kendi healthcheck kullanıyorsa bu opsiyonel)
    # healthcheck:
    #   test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s
